<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Pets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css" />
    <!--
      Pre-apply theme before stylesheets finish loading to minimize
      flash-of-wrong-theme. chrome.storage.local.get is still async (callback),
      so there is a brief window (~0-10ms) where the page renders with the
      default light theme before the stored theme is applied. This is
      acceptable for an extension popup: the popup is small and short-lived,
      and the flicker is imperceptible in practice. A synchronous alternative
      (e.g. localStorage) is not available in service-worker extension contexts.
    -->
    <script>
      // SYNC: storage key must match KEY in src/settings.ts; field name must
      // match Settings.theme. No bundler runs over this inline script, so
      // changes to either side need a manual update here.
      chrome.storage.local.get('pixel-pets-settings-v1', function(r) {
        var s = r['pixel-pets-settings-v1'];
        document.body.dataset.theme = (s && s.theme) ? s.theme : 'light';
      });
    </script>
  </head>
  <body>
    <div id="app">
      <div id="special-page-banner" hidden>
        Pets can't run on this page — it's a special browser page.
      </div>
      <header>
        <div class="header-row">
          <h1>Pixel Pets</h1>
          <div class="header-actions">
            <button id="btn-theme" class="btn-icon" title="Toggle dark mode">
              <!-- Sun icon (shown in dark mode to switch to light) -->
              <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <!-- Moon icon (shown in light mode to switch to dark) -->
              <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button id="btn-toggle" class="btn-icon btn-icon--emoji" title="Hide all pets">
              <span aria-hidden="true">👁️</span>
            </button>
            <button id="btn-throw-ball" class="btn-icon btn-icon--emoji" title="Throw ball on page">
              <span aria-hidden="true">🎾</span>
            </button>
          </div>
        </div>
      </header>

      <section id="pets-list">
        <!-- Populated by popup.ts -->
      </section>

      <button id="btn-add-toggle" class="fab" aria-expanded="false">+ Add pet</button>

      <section id="add-pet-form">
        <div id="add-pet-body">
        <div class="form-grid">
          <label for="pet-name">Name</label>
          <input type="text" id="pet-name" placeholder="Rex" maxlength="16" />

          <label id="pet-type-label">Type</label>
          <div id="pet-type-grid" role="radiogroup" aria-labelledby="pet-type-label">
            <!-- Populated by popup.ts via buildTypePickerHTML() -->
          </div>
          <input type="hidden" id="pet-type-value" value="dog" />

          <label for="pet-color">Color</label>
          <select id="pet-color">
            <!-- Options populated dynamically based on type -->
          </select>
        </div>

        <button id="btn-add" class="btn-primary">Add Pet</button>
        </div>
      </section>

      <footer>
        <p>Click a pet to feed · Double-click page to throw ball</p>
      </footer>
    </div>
    <script type="module" src="popup.ts"></script>
  </body>
</html>
