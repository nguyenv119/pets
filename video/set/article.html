    <h1>A short history of the night light</h1>
    <p class="byline">by R. Okafor, 9 min read</p>
    <p class="lede-1">Before electricity, a night light was a candle in a jar, and someone had to stay up to watch it.</p>
    <p class="lede-2">Later ones plugged into the wall and glowed just enough to find a door, and not enough to read by.</p>
